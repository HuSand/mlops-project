name: Promote to Production

# Manual, one-click promotion of the whole stack to the prod environment.
#
# What "prod" means in this project (same GCP project + same `mlops` BQ dataset
# as dev — only the deploy targets differ):
#   backend  -> Cloud Run service `insurance-api`  (APP_ENV=prod)
#   frontend -> Vercel production, pointed at the prod backend URL
#   branch   -> `prod` fast-forwarded to the promoted ref (hygiene)
#
# Model & seed data have NO separate prod target: the prod backend loads the
# same GCS_MODEL_URI (current MLflow Production model) as dev, and the BQ
# `mlops` dataset is shared. The seed toggle below writes to that shared table,
# so it is OFF by default. There is nothing to "migrate" for the model — the
# prod backend picks up the Production model automatically on deploy.

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy backend to Cloud Run prod (insurance-api)"
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy frontend to Vercel prod (points at prod backend)"
        type: boolean
        default: true
      update_prod_branch:
        description: "Fast-forward the `prod` branch to this ref"
        type: boolean
        default: true
      seed_prod_data:
        description: "Seed BigQuery (SHARED mlops dataset — affects dev too!)"
        type: boolean
        default: false
      model_version:
        description: "MODEL_VERSION label for the backend (optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: write   # push the prod branch
  id-token: write   # GCP Workload Identity Federation

env:
  REGION: asia-southeast2
  AR_REPO: mlops-images
  IMAGE_NAME: insurance-api

jobs:
  # ---------------------------------------------------------------------------
  # Hygiene: make the `prod` branch reflect exactly what we are promoting.
  # Runs first so the branch only moves once the human kicked off the run.
  # ---------------------------------------------------------------------------
  update-prod-branch:
    name: Fast-forward prod branch
    if: ${{ inputs.update_prod_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push current ref to prod
        run: |
          echo "Promoting ${GITHUB_REF_NAME} (${GITHUB_SHA}) to prod branch"
          git push origin "HEAD:refs/heads/prod"

  # ---------------------------------------------------------------------------
  # Backend -> Cloud Run prod. environment: prod gates this on manual approval
  # (configure a required reviewer on the `prod` environment).
  # ---------------------------------------------------------------------------
  backend:
    name: Deploy backend (Cloud Run prod)
    if: ${{ inputs.deploy_backend }}
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}
        run: |
          docker build -f dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:prod" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:prod"

      - name: Deploy to Cloud Run (prod)
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}
          MODEL_VERSION: ${{ inputs.model_version || github.run_number }}
        run: |
          gcloud run deploy "${IMAGE_NAME}" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --service-account "${{ secrets.RUNTIME_SA }}" \
            --set-env-vars "APP_ENV=prod,MODEL_VERSION=${MODEL_VERSION},GCS_MODEL_URI=${{ secrets.GCS_MODEL_URI }},ENABLE_BQ_LOGGING=true,BQ_PROJECT=${{ secrets.GCP_PROJECT_ID }},BQ_DATASET=mlops,BQ_TABLE=prediction_logs"

      - name: Set Discord webhook env on Cloud Run
        run: |
          gcloud run services update "${IMAGE_NAME}" \
            --region "$REGION" \
            --update-env-vars "DISCORD_WEBHOOK_API=${{ secrets.DISCORD_WEBHOOK_DEPLOY }}" \
            --quiet

      - name: Smoke test deployed service
        id: smoke
        run: |
          URL=$(gcloud run services describe "${IMAGE_NAME}" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Hitting $URL/ ..."
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/" -o /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after retries"
          exit 1

  # ---------------------------------------------------------------------------
  # Frontend -> Vercel prod. Resolves the prod backend URL at build time and
  # injects it as NEXT_PUBLIC_API_BASE_URL so prod frontend never talks to dev.
  # If the backend job ran, reuse its URL; otherwise look it up via gcloud.
  # ---------------------------------------------------------------------------
  frontend:
    name: Deploy frontend (Vercel prod)
    if: ${{ inputs.deploy_frontend && !cancelled() && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    needs: [backend]
    runs-on: ubuntu-latest
    environment: prod
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve prod backend URL
        id: api
        env:
          FROM_BACKEND: ${{ needs.backend.outputs.url }}
        run: |
          if [ -n "$FROM_BACKEND" ]; then
            URL="$FROM_BACKEND"
          else
            URL=$(gcloud run services describe "${IMAGE_NAME}" --region "$REGION" --format='value(status.url)')
          fi
          if [ -z "$URL" ]; then
            echo "Could not resolve prod backend URL"; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Prod frontend will call: $URL"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel (inject prod backend URL)
        run: |
          vercel build --prod \
            --build-env NEXT_PUBLIC_API_BASE_URL="${{ steps.api.outputs.url }}" \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (prod)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Smoke test deployment
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            case "$CODE" in
              2??|3??|401|403) echo "Deployment reachable ($CODE)"; exit 0 ;;
            esac
            sleep 10
          done
          echo "Smoke test failed (no response / server error)"
          exit 1

  # ---------------------------------------------------------------------------
  # Optional: seed the SHARED mlops BQ dataset. OFF by default — this writes to
  # the same table dev reads from. Kept for parity with seed-bigquery.yml.
  # ---------------------------------------------------------------------------
  seed-data:
    name: Seed BigQuery (shared dataset)
    if: ${{ inputs.seed_prod_data }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-cloud-bigquery
      - name: Seed 500 rows to BigQuery
        run: |
          python -c "
          from google.cloud import bigquery
          import json
          from datetime import datetime, timezone, timedelta
          import random

          client = bigquery.Client(project='${{ secrets.GCP_PROJECT_ID }}')
          table_id = '${{ secrets.GCP_PROJECT_ID }}.mlops.prediction_logs'

          rows = []
          for i in range(500):
              payload = {
                  'Gender': random.choice(['Male', 'Female']),
                  'Age': float(random.randint(20, 70)),
                  'HasDrivingLicense': float(random.randint(0, 1)),
                  'RegionID': float(random.randint(1, 52)),
                  'Switch': float(random.choice([-1, 0, 1])),
                  'PastAccident': random.choice(['Yes', 'No', 'Unknown']),
                  'AnnualPremium': round(random.uniform(800, 6000), 2)
              }
              rows.append({
                  'input_payload': json.dumps(payload),
                  'timestamp': (datetime.now(timezone.utc) - timedelta(minutes=random.randint(1, 1440))).isoformat(),
                  'prediction': random.randint(0, 1),
                  'model_version': 'prod-seed'
              })

          errors = client.insert_rows_json(table_id, rows)
          if errors:
              print('Errors:', errors); exit(1)
          print(f'Inserted {len(rows)} rows into BigQuery')
          "

  # ---------------------------------------------------------------------------
  # Single Discord notification summarizing the whole promotion.
  # ---------------------------------------------------------------------------
  notify:
    name: Notify Discord (promotion summary)
    if: always()
    needs: [update-prod-branch, backend, frontend, seed-data]
    runs-on: ubuntu-latest
    steps:
      - name: Send summary
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BRANCH: ${{ needs.update-prod-branch.result }}
          SEED: ${{ needs.seed-data.result }}
          API_URL: ${{ needs.backend.outputs.url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No Discord webhook configured"; exit 0; fi
          # green only if nothing actually failed (skipped is fine)
          if echo "$BACKEND $FRONTEND $BRANCH $SEED" | grep -qw failure; then
            COLOR=15158332; TITLE="Promote to Prod - FAILED"
          else
            COLOR=3066993; TITLE="Promote to Prod - SUCCESS"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST "$WEBHOOK" -d "{
            \"embeds\": [{
              \"title\": \"${TITLE}\",
              \"color\": ${COLOR},
              \"fields\": [
                {\"name\": \"Backend\", \"value\": \"${BACKEND}\", \"inline\": true},
                {\"name\": \"Frontend\", \"value\": \"${FRONTEND}\", \"inline\": true},
                {\"name\": \"Prod branch\", \"value\": \"${BRANCH}\", \"inline\": true},
                {\"name\": \"Seed\", \"value\": \"${SEED}\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"${GITHUB_SHA:0:7}\", \"inline\": true},
                {\"name\": \"API URL\", \"value\": \"${API_URL:-n/a}\"},
                {\"name\": \"Run\", \"value\": \"[#${{ github.run_number }}](${RUN_URL})\"}
              ]
            }]
          }" || true
