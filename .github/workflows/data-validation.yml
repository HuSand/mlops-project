name: Data Validation

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write 

jobs:
  auth:
    name: Authenticate to GCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'

  dvc-pull:
    name: Pull Data from GCS
    needs: auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "dvc[gs]"
      - run: dvc pull

  validate:
    name: Run Data Validation
    needs: dvc-pull
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "dvc[gs]"
      - run: pip install -r requirements.txt
      - run: dvc pull
      - run: python ml/validate.py data/train.csv
      - run: python ml/validate.py data/test.csv --no-target

  create-issue-on-failure:
    name: Create Issue on Failure
    needs: validate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh issue create \
            --title "Data validation failed - run #${{ github.run_number }}" \
            --body "Validasi data gagal. Cek logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "data-quality"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}