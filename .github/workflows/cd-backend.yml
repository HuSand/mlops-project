name: CD Backend - Cloud Run

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version label (optional; defaults to run number)"
        required: false
        default: ""
  push:
    branches: [dev, prod]
    paths:
      - 'app/**'
      - 'dockerfile'
      - 'requirements-serve.txt'
      - '.github/workflows/cd-backend.yml'
  pull_request:
    branches: [dev, prod]
    paths:
      - 'app/**'
      - 'dockerfile'
      - 'requirements-serve.txt'
      - '.github/workflows/cd-backend.yml'

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-southeast2
  AR_REPO: mlops-images
  IMAGE_NAME: insurance-api

jobs:
  # On PRs: prove the container builds. No secrets, never blocks the PR.
  build-check:
    name: Build image (PR check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -f dockerfile -t insurance-api-ci .

  # On workflow_dispatch (called by CT) or push to dev/prod: build, push, deploy.
  # The target Cloud Run service and APP_ENV are derived from the branch:
  #   prod branch -> service "insurance-api"     (APP_ENV=prod, environment prod)
  #   otherwise   -> service "insurance-api-dev" (APP_ENV=dev,  environment dev)
  deploy:
    name: Build, push and deploy to Cloud Run
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "service=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
            echo "app_env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "service=${IMAGE_NAME}-dev" >> "$GITHUB_OUTPUT"
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
          fi

      # Secrets cannot be evaluated in `if:` directly, so map to env and emit
      # an output. If GCP is not configured yet (P4 pending), skip all GCP
      # steps and let the job pass green.
      - name: Check GCP configuration
        id: guard
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$GCP_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_PROJECT_ID not set - skipping Cloud Run deploy (infra pending)."
          fi

      - name: Authenticate to GCP
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.guard.outputs.configured == 'true'
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push image
        if: steps.guard.outputs.configured == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}
        run: |
          docker build -f dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        if: steps.guard.outputs.configured == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}
          SERVICE: ${{ steps.target.outputs.service }}
          APP_ENV: ${{ steps.target.outputs.app_env }}
          MODEL_VERSION: ${{ github.event.inputs.model_version || github.run_number }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --service-account "${{ secrets.RUNTIME_SA }}" \
            --set-env-vars "APP_ENV=${APP_ENV},MODEL_VERSION=${MODEL_VERSION},GCS_MODEL_URI=${{ secrets.GCS_MODEL_URI }},
            ENABLE_BQ_LOGGING=true,BQ_PROJECT=${{ secrets.GCP_PROJECT_ID }},BQ_DATASET=mlops,BQ_TABLE=prediction_logs"

      # Set the Discord webhook the running service uses to notify on API hits.
      # Done as a separate update so the main --set-env-vars block is untouched.
      - name: Set Discord webhook env on Cloud Run
        if: steps.guard.outputs.configured == 'true'
        env:
          SERVICE: ${{ steps.target.outputs.service }}
        run: |
          gcloud run services update "$SERVICE" \
            --region "$REGION" \
            --update-env-vars "DISCORD_WEBHOOK_API=${{ secrets.DISCORD_WEBHOOK_DEPLOY }}" \
            --quiet

      # Post-deploy smoke test: the new revision must answer its health check.
      - name: Smoke test deployed service
        id: smoke
        if: steps.guard.outputs.configured == 'true'
        env:
          SERVICE: ${{ steps.target.outputs.service }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Hitting $URL/ ..."
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/" -o /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after retries"
          exit 1

      # Notify Discord on every CD run (success or failure).
      - name: Notify Discord (deploy)
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          STATUS: ${{ job.status }}
          SERVICE: ${{ steps.target.outputs.service }}
          APP_ENV: ${{ steps.target.outputs.app_env }}
          URL: ${{ steps.smoke.outputs.url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No Discord webhook configured"; exit 0; fi
          if [ "$STATUS" = "success" ]; then COLOR=3066993; else COLOR=15158332; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST "$WEBHOOK" -d "{
            \"embeds\": [{
              \"title\": \"CD Backend - ${STATUS}\",
              \"color\": ${COLOR},
              \"fields\": [
                {\"name\": \"Service\", \"value\": \"${SERVICE:-n/a}\", \"inline\": true},
                {\"name\": \"Env\", \"value\": \"${APP_ENV:-n/a}\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"${GITHUB_SHA:0:7}\", \"inline\": true},
                {\"name\": \"URL\", \"value\": \"${URL:-n/a}\"},
                {\"name\": \"Run\", \"value\": \"[#${{ github.run_number }}](${RUN_URL})\"}
              ]
            }]
          }" || true