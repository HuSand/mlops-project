name: CD Backend - Cloud Run

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version label (optional; defaults to run number)"
        required: false
        default: ""
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - 'dockerfile'
      - 'requirements-serve.txt'
      - '.github/workflows/cd-backend.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'app/**'
      - 'dockerfile'
      - 'requirements-serve.txt'
      - '.github/workflows/cd-backend.yml'

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-southeast2
  AR_REPO: mlops-images
  SERVICE: insurance-api

jobs:
  # On PRs: prove the container builds. No secrets, never blocks the PR.
  build-check:
    name: Build image (PR check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -f dockerfile -t insurance-api-ci .

  # On workflow_dispatch (called by CT) or push to dev: build, push, deploy.
  deploy:
    name: Build, push and deploy to Cloud Run
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      # Secrets cannot be evaluated in `if:` directly, so map to env and emit
      # an output. If GCP is not configured yet (P4 pending), skip all GCP
      # steps and let the job pass green.
      - name: Check GCP configuration
        id: guard
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$GCP_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_PROJECT_ID not set - skipping Cloud Run deploy (infra pending)."
          fi

      - name: Authenticate to GCP
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.guard.outputs.configured == 'true'
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push image
        if: steps.guard.outputs.configured == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
        run: |
          docker build -f dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        if: steps.guard.outputs.configured == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
          MODEL_VERSION: ${{ github.event.inputs.model_version || github.run_number }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --service-account "${{ secrets.RUNTIME_SA }}" \
            --set-env-vars "APP_ENV=prod,MODEL_VERSION=${MODEL_VERSION},GCS_MODEL_URI=${{ secrets.GCS_MODEL_URI }},ENABLE_BQ_LOGGING=true,BQ_PROJECT=${{ secrets.GCP_PROJECT_ID }},BQ_DATASET=mlops,BQ_TABLE=prediction_logs"
