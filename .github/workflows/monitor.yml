name: Monitor - Drift Detection

on:
  schedule:
    # Daily 06:00 WIB = 23:00 UTC previous day
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write
  id-token: write

jobs:
  # ============================================================
  # JOB 1: Fetch Data (BigQuery & DVC)
  # ============================================================
  fetch-data:
    name: Fetch Data (BQ & DVC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch production prediction logs from BigQuery
        run: |
          pip install pandas google-cloud-bigquery pyarrow
          mkdir -p monitoring/data
          python monitoring/fetch_production_data.py \
            --project-id ${{ secrets.GCP_PROJECT_ID }} \
            --output monitoring/data/current_data.csv

      - name: Pull reference training data (DVC)
        run: |
          pip install "dvc[gs]"
          dvc pull data --remote gcsremote
          mkdir -p monitoring/data
          cp data/train.csv monitoring/data/reference_data.csv

      - name: Upload datasets for analysis
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-datasets
          path: monitoring/data/
          retention-days: 1

  # ============================================================
  # JOB 2: Run Drift Analysis
  # ============================================================
  drift-analysis:
    name: Run Drift Analysis
    needs: fetch-data
    runs-on: ubuntu-latest
    outputs:
      DRIFT_DETECTED: ${{ steps.check_threshold.outputs.DRIFT_DETECTED }}
      DRIFT_SCORE: ${{ steps.check_threshold.outputs.DRIFT_SCORE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download datasets
        uses: actions/download-artifact@v4
        with:
          name: monitoring-datasets
          path: monitoring/data/

      - name: Install Evidently
        run: |
          pip install evidently==0.7.21 pandas

      - name: Run Evidently drift report
        run: |
          mkdir -p monitoring/reports
          python monitoring/evidently_report.py \
            --reference monitoring/data/reference_data.csv \
            --current monitoring/data/current_data.csv \
            --output-html monitoring/reports/drift_report.html \
            --output-json monitoring/reports/drift_metrics.json

      - name: Check drift threshold
        id: check_threshold
        run: |
          DRIFT_SCORE=$(python -c "
          import json
          with open('monitoring/reports/drift_metrics.json') as f:
              data = json.load(f)
          print(data.get('drift_share', 0))
          ")
          echo "Drift score: $DRIFT_SCORE"
          echo "DRIFT_SCORE=$DRIFT_SCORE" >> $GITHUB_OUTPUT

          THRESHOLD=0.3
          DRIFT_DETECTED=$(python -c "print(1 if float('$DRIFT_SCORE') > $THRESHOLD else 0)")
          echo "DRIFT_DETECTED=$DRIFT_DETECTED" >> $GITHUB_OUTPUT

      - name: Upload reports for storage
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: monitoring/reports/
          retention-days: 1

  # ============================================================
  # JOB 3: Storage & Metrics (GCS & BQ)
  # ============================================================
  storage-and-metrics:
    name: Storage & Metrics
    needs: [fetch-data, drift-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/721834211942/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mlops-ct-pipeline@project-d50e88c7-b681-48d4-b1b.iam.gserviceaccount.com'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: monitoring-reports
          path: monitoring/reports/

      - name: Upload drift report to GCS
        run: |
          DATE=$(date +"%Y-%m-%d")
          gsutil cp monitoring/reports/drift_report.html \
            gs://dvc-mlops-ct-pipeline/reports/drift_report_${DATE}.html

      - name: Write drift metrics to BigQuery
        run: |
          pip install google-cloud-bigquery
          python monitoring/write_metrics_to_bq.py \
            --project-id ${{ secrets.GCP_PROJECT_ID }} \
            --metrics-file monitoring/reports/drift_metrics.json

  # ============================================================
  # JOB 4: Alerting & Retraining
  # ============================================================
  alerting:
    name: Alerting & Retraining
    needs: drift-analysis
    if: always() && needs.drift-analysis.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: monitoring-reports
          path: monitoring/reports/

      # Create GitHub Issue if drift detected
      - name: Create GitHub Issue for drift alert
        if: needs.drift-analysis.outputs.DRIFT_DETECTED == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const driftScore = '${{ needs.drift-analysis.outputs.DRIFT_SCORE }}';
            const date = new Date().toISOString().split('T')[0];
            const reportUrl = `https://storage.googleapis.com/dvc-mlops-ct-pipeline/reports/drift_report_${date}.html`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Drift Alert: score ${driftScore} exceeds threshold (${date})`,
              body: `## Data Drift Detected\n\n` +
                    `- **Date**: ${date}\n` +
                    `- **Drift Score**: ${driftScore}\n` +
                    `- **Threshold**: 0.3\n` +
                    `- **Report**: [View HTML Report](${reportUrl})\n\n` +
                    `CT workflow has been auto-triggered for retraining.\n\n` +
                    `_This issue was created automatically by the CM pipeline._`,
              labels: ['drift-alert', 'priority-high']
            });

      # Trigger CT retrain if drift detected
      - name: Trigger Continuous Training workflow
        if: needs.drift-analysis.outputs.DRIFT_DETECTED == '1'
        run: |
          gh workflow run ct-train.yml \
            --ref dev \
            -f trigger=drift_alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Discord notification
      - name: Notify Discord
        if: always()
        run: |
          DATE=$(date +"%Y-%m-%d")
          DRIFT_SCORE="${{ needs.drift-analysis.outputs.DRIFT_SCORE }}"
          DRIFT_DETECTED="${{ needs.drift-analysis.outputs.DRIFT_DETECTED }}"

          if [ "$DRIFT_DETECTED" = "1" ]; then
            COLOR=16711680  # red
            STATUS="DRIFT DETECTED - Retrain triggered"
          else
            COLOR=65280  # green
            STATUS="Model healthy - No drift"
          fi

          if [ -n "${{ secrets.DISCORD_WEBHOOK_ALERT }}" ]; then
            curl -H "Content-Type: application/json" -d "{
              \"embeds\": [{
                \"title\": \"Daily Drift Report - ${DATE}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Status\", \"value\": \"${STATUS}\", \"inline\": true},
                  {\"name\": \"Drift Score\", \"value\": \"${DRIFT_SCORE}\", \"inline\": true},
                  {\"name\": \"Threshold\", \"value\": \"0.3\", \"inline\": true},
                  {\"name\": \"Report\", \"value\": \"[View on GCS](https://storage.googleapis.com/dvc-mlops-ct-pipeline/reports/drift_report_${DATE}.html)\"}
                ]
              }]
            }" "${{ secrets.DISCORD_WEBHOOK_ALERT }}"
          else
            echo "No Discord webhook configured"
          fi
