name: Continuous Integration (CI)

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  quality-gate:
    name: 🛡️ Quality Gate & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # dev pulls in requirements.txt + ruff + pytest-cov + httpx (TestClient).
          # serve pulls in google-cloud-bigquery/storage so app/ can be imported.
          pip install -r requirements-dev.txt -r requirements-serve.txt bandit

      - name: Code Linting (Ruff)
        run: ruff check .

      - name: Unit Testing & Coverage (MLOps Validation)
        run: |
          pytest --cov-report=term-missing | tee pytest-output.txt

      - name: Coverage Summary
        if: always()
        run: |
          echo "## 🧪 Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "TOTAL|Name|----|passed|failed" pytest-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Security Scan (Bandit)
        run: bandit -r . -ll -ii -x ./venv,./tests

  frontend-build:
    name: 🎨 Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (type-check + bundle)
        working-directory: frontend
        run: npm run build

  container-validation:
    name: 📦 Docker Build Validation
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker Build Test
        run: |
          if [ -f Dockerfile ]; then
            docker build -f Dockerfile -t insurance-api-test .
          elif [ -f dockerfile ]; then
            docker build -f dockerfile -t insurance-api-test .
          else
            echo "Dockerfile tidak ditemukan! Build gagal."
            exit 1
          fi
