name: Continuous Integration (CI)

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  quality-gate:
    name: 🛡️ Quality Gate & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov bandit pandera
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Code Linting (Ruff)
        run: ruff check .

      - name: Unit Testing & MLOps Validation
        run: pytest

      - name: Security Scan (Bandit)
        run: bandit -r . -ll -ii -x ./venv,./tests

  container-validation:
    name: 📦 Docker Build Validation
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker Build Test
        run: |
          if [ -f dockerfile ]; then
            docker build -t insurance-api-test .
          else
            echo "dockerfile tidak ditemukan! Build gagal."
            exit 1
          fi